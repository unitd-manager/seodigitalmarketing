<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SEO Audit Form</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #111827;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    button {
  display: block;
  width: auto;
  padding: 10px 24px;
  margin: 20px auto 0;
  background: #facc15;
  color: black;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Get Your Free SEO Audit Report</h2>
    <p>Enter your details and we’ll send your SEO report within 24 hours.</p>

    <form onsubmit="handleSubmit(event)">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="url" id="website" placeholder="https://yourwebsite.com" required />
      <input type="email" id="email" placeholder="Email Address" required />

      <button type="submit">Get My Report</button>
    </form>
  </div>

  <script>
  function handleSubmit(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const website = document.getElementById("website").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();

    // Website validation
    const websitePattern =
      /^(https?:\/\/)?(www\.)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/;

    if (!websitePattern.test(website)) {
      alert("Please enter a valid website URL.");
      return;
    }

    // Strong email validation
    const emailPattern =
      /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$/;

    if (!emailPattern.test(email)) {
      alert("Please enter a valid email address.");
      return;
    }

    const data = {
      name,
      website,
      email
    };

    console.log("Form Data:", data);

    // Success message
    alert("Form submitted successfully!");

    // Reset form
    e.target.reset();

    // Redirect to homepage
    window.location.href = "https://seo.unitdtechnologies.com/";
  }
</script>
</body>
</html>
